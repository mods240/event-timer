<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bg:#0a0e14;
    --accent:#38c8ff;
    --warn:#ffbe3a;
    --text:#ffffff;
    --muted:#7a96b0;
    --border:rgba(120,200,255,0.15);
    --ad-h:120px;
  }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif;
    overflow:hidden;
  }

  /* ── メインレイアウト ── */
  .layout{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ── アプリiframe ── */
  .app-frame{
    flex:1;
    width:100%;
    border:none;
    display:block;
    min-height:0;
  }

  /* ── 下部バー ── */
  .ad-bar{
    flex-shrink:0;
    height:var(--ad-h);
    background:#0d1318;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    gap:6px;
  }

  /* 利用ガイドリンク */
  .guide-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:11px;
    letter-spacing:.15em;
    color:#38c8ff;
    text-decoration:none;
    background:rgba(56,200,255,.08);
    border:1px solid rgba(56,200,255,.25);
    border-radius:3px;
    padding:4px 14px;
    transition:all .15s;
  }
  .guide-link:hover{
    background:rgba(56,200,255,.16);
    border-color:rgba(56,200,255,.5);
  }
  @media(max-width:768px){
    .guide-link{font-size:10px;padding:3px 10px;}
  }

  /* 広告ラベル */
  .ad-label{
    position:absolute;
    top:4px;
    right:8px;
    font-size:9px;
    letter-spacing:.2em;
    color:var(--muted);
    opacity:.5;
  }

  /* AdSenseが入るまでのプレースホルダー */
  .ad-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
  }
  .ad-placeholder-inner{
    border:1px dashed rgba(120,200,255,0.15);
    border-radius:4px;
    padding:10px 24px;
    text-align:center;
    width:calc(100% - 32px);
    max-width:728px;
    height:calc(100% - 16px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:4px;
  }
  .ad-placeholder-text{
    font-size:11px;
    letter-spacing:.2em;
    color:var(--muted);
    opacity:.4;
  }

  /* AdSenseユニット */
  .ad-unit{
    display:block;
    width:100%;
    max-width:728px;
    height:90px;
    text-align:center;
  }

  /* ── スマホ対応 ── */
  @media(max-width:768px){
    :root{
      --ad-h:100px;
    }
    .ad-unit{
      max-width:320px;
      height:50px;
    }
  }

  /* ── FULLSCREEN MODE ── */
  .app-frame.fullscreen{
    position:fixed !important;
    top:0 !important;
    left:0 !important;
    width:100vw !important;
    height:100vh !important;
    z-index:9999 !important;
    background:#0a0e14 !important;
    border:none !important;
  }
  .ad-bar.hidden{
    display:none !important;
  }
  body.fullscreen-mode{
    overflow:hidden;
  }
</style>
</head>
<body>

<div class="layout">

  <!-- アプリ本体 -->
  <iframe
    class="app-frame"
    src="event_timer.html"
    title="EVENT TIMER"
    allow="clipboard-write"
  ></iframe>

  <!-- 広告エリア -->
  <div class="ad-bar">
    <!-- リンク群 -->
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;">
      <a class="guide-link" href="event_timer_guide.pdf" target="_blank" download="EVENT_TIMER利用ガイド.pdf">
        📄 利用ガイド（PDF）をダウンロード
      </a>
      <a class="guide-link" href="https://event-timer-omega.vercel.app/event_timer_blog.html" target="_blank" style="border-color:rgba(255,190,58,.35);color:#ffbe3a;background:rgba(255,190,58,.08);">
        💡 アプリコンセプト
      </a>
    </div>

    <div class="ad-label">広告</div>

    <!-- ▼▼▼ AdSense審査通過後、下のプレースホルダーをAdSenseコードに置き換えてください ▼▼▼ -->
    <div class="ad-placeholder">
      <div class="ad-placeholder-inner">
        <div class="ad-placeholder-text">ADVERTISEMENT</div>
        <div class="ad-placeholder-text" style="font-size:8px;opacity:.6">AdSense審査通過後にここに広告が表示されます</div>
      </div>
    </div>

    <!-- AdSenseコード例（審査通過後にプレースホルダーと置き換え）
    <ins class="adsbygoogle ad-unit"
      data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="XXXXXXXXXX"
      data-ad-format="horizontal"
      data-full-width-responsive="true">
    </ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
    <!-- ▲▲▲ ここまで ▲▲▲ -->

  </div>

</div>

<script>
// Listen for fullscreen messages from iframe (event_timer.html)
window.addEventListener('message', function(e){
  if(!e.data||e.data.type!=='fullscreen')return;
  const frame=document.querySelector('.app-frame');
  const adBar=document.querySelector('.ad-bar');
  if(e.data.active){
    frame.classList.add('fullscreen');
    document.body.classList.add('fullscreen-mode');
    if(adBar)adBar.classList.add('hidden');
  }else{
    frame.classList.remove('fullscreen');
    document.body.classList.remove('fullscreen-mode');
    if(adBar)adBar.classList.remove('hidden');
  }
});
// ESC key to exit fullscreen
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const frame=document.querySelector('.app-frame');
    const adBar=document.querySelector('.ad-bar');
    if(frame&&frame.classList.contains('fullscreen')){
      frame.classList.remove('fullscreen');
      document.body.classList.remove('fullscreen-mode');
      if(adBar)adBar.classList.remove('hidden');
      frame.contentWindow.postMessage({type:'fullscreen-cancel'},'*');
    }
  }
});
</script>
</body>
</html>
