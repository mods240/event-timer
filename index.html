<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVENT TIMER — イベント進行管理ツール</title>
<meta name="description" content="音響・照明・映像スタッフとリアルタイム共有できるイベント進行管理ツール。タイムテーブル管理・遅延調整・QRコード共有に対応。">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Google AdSense -->
<meta name="google-adsense-account" content="ca-pub-0822883607725147">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0822883607725147" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  :root{
    --bg:#0a0e14;
    --accent:#38c8ff;
    --warn:#ffbe3a;
    --text:#ffffff;
    --muted:#7a96b0;
    --border:rgba(120,200,255,0.15);
    --ad-h:90px; /* 広告エリアの高さ */
  }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif;
    overflow:hidden;
  }

  /* ── メインレイアウト ── */
  .layout{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ── アプリiframe ── */
  .app-frame{
    flex:1;
    width:100%;
    border:none;
    display:block;
    min-height:0;
  }

  /* ── 広告エリア ── */
  .ad-bar{
    flex-shrink:0;
    height:var(--ad-h);
    background:#0d1318;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  /* 広告ラベル */
  .ad-label{
    position:absolute;
    top:4px;
    right:8px;
    font-size:9px;
    letter-spacing:.2em;
    color:var(--muted);
    opacity:.5;
  }

  /* AdSenseが入るまでのプレースホルダー */
  .ad-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
  }
  .ad-placeholder-inner{
    border:1px dashed rgba(120,200,255,0.15);
    border-radius:4px;
    padding:10px 24px;
    text-align:center;
    width:calc(100% - 32px);
    max-width:728px;
    height:calc(100% - 16px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:4px;
  }
  .ad-placeholder-text{
    font-size:11px;
    letter-spacing:.2em;
    color:var(--muted);
    opacity:.4;
  }

  /* AdSenseユニット */
  .ad-unit{
    display:block;
    width:100%;
    max-width:728px;
    height:90px;
    text-align:center;
  }

  /* ── スマホ対応 ── */
  @media(max-width:768px){
    :root{
      --ad-h:60px;
    }
    .ad-unit{
      max-width:320px;
      height:50px;
    }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- アプリ本体 -->
  <iframe
    class="app-frame"
    src="event_timer.html"
    title="EVENT TIMER"
    allow="clipboard-write"
  ></iframe>

  <!-- 広告エリア -->
  <div class="ad-bar">
    <div class="ad-label">広告</div>

    <!-- ▼▼▼ AdSense審査通過後、下のプレースホルダーをAdSenseコードに置き換えてください ▼▼▼ -->
    <div class="ad-placeholder">
      <div class="ad-placeholder-inner">
        <div class="ad-placeholder-text">ADVERTISEMENT</div>
        <div class="ad-placeholder-text" style="font-size:8px;opacity:.6">AdSense審査通過後にここに広告が表示されます</div>
      </div>
    </div>

    <!-- AdSenseコード例（審査通過後にプレースホルダーと置き換え）
    <ins class="adsbygoogle ad-unit"
      data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
      data-ad-slot="XXXXXXXXXX"
      data-ad-format="horizontal"
      data-full-width-responsive="true">
    </ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
    <!-- ▲▲▲ ここまで ▲▲▲ -->

  </div>

</div>

</body>
</html>
