<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVENT TIMER</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 0.95em;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 1.3em;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: #667eea;
      border-radius: 2px;
    }

    .event-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .info-field {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.85em;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .info-input {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    .info-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-success {
      background: #4caf50;
      color: white;
    }

    .btn-success:hover {
      background: #45a049;
    }

    .btn-danger {
      background: #f44336;
      color: white;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .schedule-table thead {
      background: #f5f5f5;
    }

    .schedule-table th,
    .schedule-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .schedule-table th {
      font-weight: 700;
      color: #667eea;
    }

    .schedule-table tr:hover {
      background: #f9f9f9;
    }

    .schedule-table .time-cell {
      font-weight: 600;
      color: #667eea;
      font-size: 1.1em;
    }

    .schedule-table .duration-cell {
      color: #666;
    }

    .lock-icon {
      color: #f44336;
    }

    .timer-display {
      background: #1a1a1a;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 15px 0;
    }

    .timer-display .current-time {
      font-size: 3em;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    .timer-display .current-part {
      font-size: 1.3em;
      margin-bottom: 5px;
    }

    .timer-display .next-part {
      font-size: 0.9em;
      opacity: 0.7;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal.active {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      font-size: 1.5em;
      font-weight: 700;
      margin-bottom: 15px;
      color: #667eea;
    }

    .modal-body {
      margin-bottom: 20px;
      color: #333;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert-info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.8em;
      }

      .event-info {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }

      button {
        width: 100%;
        justify-content: center;
      }

      .schedule-table th,
      .schedule-table td {
        padding: 8px;
        font-size: 0.9em;
      }

      .timer-display .current-time {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⏱ EVENT TIMER</h1>
    <p>リアルタイムイベント進行管理ツール</p>
  </div>

  <div class="content">
    <!-- Firebase設定 -->
    <div id="firebaseSetup" style="display: none;">
      <div class="section">
        <div class="section-title">Firebase 接続設定</div>
        <p style="color: #666; margin-bottom: 15px;">リアルタイム共有を使うにはFirebaseの設定が必要です</p>
        
        <div class="event-info">
          <div class="info-field">
            <label class="info-label">API KEY</label>
            <input type="password" id="apiKey" class="info-input" placeholder="AIzaSy...">
          </div>
          <div class="info-field">
            <label class="info-label">Auth Domain</label>
            <input type="text" id="authDomain" class="info-input" placeholder="your-project.firebaseapp.com">
          </div>
          <div class="info-field">
            <label class="info-label">Database URL</label>
            <input type="text" id="databaseURL" class="info-input" placeholder="https://your-project-default-rtdb...">
          </div>
          <div class="info-field">
            <label class="info-label">Project ID</label>
            <input type="text" id="projectId" class="info-input" placeholder="your-project">
          </div>
          <div class="info-field">
            <label class="info-label">Storage Bucket</label>
            <input type="text" id="storageBucket" class="info-input" placeholder="your-project.appspot.com">
          </div>
          <div class="info-field">
            <label class="info-label">Messaging Sender ID</label>
            <input type="text" id="messagingSenderId" class="info-input" placeholder="123456789012">
          </div>
          <div class="info-field">
            <label class="info-label">App ID</label>
            <input type="text" id="appId" class="info-input" placeholder="1:123456789012:web:...">
          </div>
        </div>

        <div class="btn-group">
          <button class="btn-primary" onclick="testConnection()">接続テスト</button>
          <button class="btn-success" onclick="saveFirebaseConfig()">保存して開始</button>
        </div>

        <div id="configMessage"></div>
      </div>
    </div>

    <!-- メインUI -->
    <div id="mainUI" style="display: none;">
      <!-- イベント情報 -->
      <div class="section">
        <div class="section-title">イベント情報</div>
        <div class="event-info">
          <div class="info-field">
            <label class="info-label">イベント名</label>
            <input type="text" id="eventName" class="info-input" placeholder="例：カンファレンス2024">
          </div>
          <div class="info-field">
            <label class="info-label">開催日</label>
            <input type="date" id="eventDate" class="info-input">
          </div>
        </div>

        <!-- Excelインポートボタン -->
        <div class="btn-group">
          <div class="file-input-wrapper">
            <button class="btn-secondary">📊 Excelをインポート</button>
            <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" onchange="importExcel(event)">
          </div>
        </div>
      </div>

      <!-- スケジュール -->
      <div class="section">
        <div class="section-title">タイムテーブル</div>
        
        <div class="btn-group">
          <button class="btn-primary" onclick="addScheduleRow()">+ パートを追加</button>
          <button class="btn-secondary" onclick="downloadSchedule()">💾 テンプレートをダウンロード</button>
          <button class="btn-danger" onclick="clearSchedule()">🗑 すべて削除</button>
        </div>

        <table class="schedule-table">
          <thead>
            <tr>
              <th>時刻</th>
              <th>パート名</th>
              <th>予定時間</th>
              <th>ロック</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="scheduleList">
          </tbody>
        </table>
      </div>

      <!-- 進行操作 -->
      <div class="section">
        <div class="section-title">進行管理</div>
        
        <div id="timerDisplay" class="timer-display" style="display: none;">
          <div class="current-time" id="currentTime">--:--</div>
          <div class="current-part" id="currentPart">-</div>
          <div class="next-part" id="nextPart">-</div>
        </div>

        <div class="btn-group">
          <button class="btn-primary" onclick="startShow()" id="startBtn">▶ 進行開始</button>
          <button class="btn-secondary" onclick="pauseShow()" id="pauseBtn" style="display: none;">⏸ 一時停止</button>
          <button class="btn-secondary" onclick="stopShow()" id="stopBtn" style="display: none;">⏹ 終了</button>
          <button class="btn-secondary" onclick="shareShow()">🔗 スタッフに共有</button>
        </div>

        <!-- 遅延調整 -->
        <div style="margin-top: 20px;">
          <div class="section-title">遅延調整</div>
          <div class="btn-group">
            <button class="btn-secondary" onclick="adjustDelay(-5)">-5分</button>
            <button class="btn-secondary" onclick="adjustDelay(-2)">-2分</button>
            <button class="btn-secondary" onclick="adjustDelay(0)">リセット</button>
            <button class="btn-secondary" onclick="adjustDelay(2)">+2分</button>
            <button class="btn-secondary" onclick="adjustDelay(5)">+5分</button>
          </div>
          <div id="delayMessage" style="margin-top: 10px; color: #666;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- アラート -->
<div id="alertBox"></div>

<!-- シェアモーダル -->
<div id="shareModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">スタッフと共有</div>
    <div class="modal-body">
      <p>以下のURLをスタッフに共有してください：</p>
      <input type="text" id="shareURL" class="info-input" readonly style="margin-top: 10px;">
      <p style="margin-top: 10px; font-size: 0.9em; color: #666;">またはQRコードをスキャン：</p>
      <div id="qrCode" style="margin-top: 10px; text-align: center;">
        <img id="qrImage" style="max-width: 200px;">
      </div>
    </div>
    <div class="modal-buttons">
      <button class="btn-secondary" onclick="closeShareModal()">閉じる</button>
      <button class="btn-primary" onclick="copyShareURL()">URLをコピー</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  let schedule = [];
  let isRunning = false;
  let currentDelay = 0;
  let firebaseConfig = null;
  let db = null;
  let sessionId = null;

  // 初期化
  window.onload = function() {
    loadFirebaseConfig();
    loadEventInfo();
    renderSchedule();
    setEventDate();
  };

  // Firebase設定の読み込み
  function loadFirebaseConfig() {
    const saved = localStorage.getItem('firebaseConfig');
    if (!saved) {
      document.getElementById('firebaseSetup').style.display = 'block';
      document.getElementById('mainUI').style.display = 'none';
    } else {
      firebaseConfig = JSON.parse(saved);
      initializeFirebase();
      document.getElementById('firebaseSetup').style.display = 'none';
      document.getElementById('mainUI').style.display = 'block';
    }
  }

  // Firebase初期化
  function initializeFirebase() {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }

  // Firebase設定の保存
  function saveFirebaseConfig() {
    firebaseConfig = {
      apiKey: document.getElementById('apiKey').value,
      authDomain: document.getElementById('authDomain').value,
      databaseURL: document.getElementById('databaseURL').value,
      projectId: document.getElementById('projectId').value,
      storageBucket: document.getElementById('storageBucket').value,
      messagingSenderId: document.getElementById('messagingSenderId').value,
      appId: document.getElementById('appId').value
    };

    localStorage.setItem('firebaseConfig', JSON.stringify(firebaseConfig));
    initializeFirebase();
    showAlert('Firebase設定を保存しました', 'success');
    
    setTimeout(() => {
      document.getElementById('firebaseSetup').style.display = 'none';
      document.getElementById('mainUI').style.display = 'block';
    }, 1000);
  }

  // 接続テスト
  async function testConnection() {
    try {
      const testApp = firebase.initializeApp({
        apiKey: document.getElementById('apiKey').value,
        authDomain: document.getElementById('authDomain').value,
        databaseURL: document.getElementById('databaseURL').value,
        projectId: document.getElementById('projectId').value,
        storageBucket: document.getElementById('storageBucket').value,
        messagingSenderId: document.getElementById('messagingSenderId').value,
        appId: document.getElementById('appId').value
      }, 'test');

      const testDb = testApp.database();
      await testDb.ref('test').set({timestamp: new Date().toISOString()});
      showAlert('接続成功！', 'success');
      testApp.delete();
    } catch (e) {
      showAlert('接続失敗：' + e.message, 'error');
    }
  }

  // Excel インポート
  function importExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

        schedule = [];
        for (let i = 1; i < rows.length; i++) {
          if (rows[i][0] && rows[i][1]) {
            schedule.push({
              time: rows[i][0],
              name: rows[i][1],
              locked: rows[i][2] === '✓' || rows[i][2] === 'true'
            });
          }
        }

        renderSchedule();
        showAlert(`${schedule.length}個のパートをインポートしました`, 'success');
        saveSchedule();
      } catch (err) {
        showAlert('ファイルの読み込みに失敗しました：' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // スケジュール描画
  function renderSchedule() {
    const list = document.getElementById('scheduleList');
    list.innerHTML = '';

    schedule.forEach((item, idx) => {
      const duration = idx < schedule.length - 1 ? calculateDuration(item.time, schedule[idx + 1].time) : '---';
      
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="time-cell">${item.time}</td>
        <td>${item.name}</td>
        <td class="duration-cell">${duration}</td>
        <td>${item.locked ? '<span class="lock-icon">🔒</span>' : ''}</td>
        <td>
          <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8em;" onclick="deleteRow(${idx})">削除</button>
        </td>
      `;
      list.appendChild(tr);
    });
  }

  // 時間計算
  function calculateDuration(start, end) {
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    const diff = (eh * 60 + em) - (sh * 60 + sm);
    return diff > 0 ? `${diff}分` : '---';
  }

  // パート追加
  function addScheduleRow() {
    schedule.push({time: '00:00', name: '新規パート', locked: false});
    renderSchedule();
  }

  // 行削除
  function deleteRow(idx) {
    schedule.splice(idx, 1);
    renderSchedule();
  }

  // スケジュール削除
  function clearSchedule() {
    if (confirm('すべてのパートを削除してもよろしいですか？')) {
      schedule = [];
      renderSchedule();
    }
  }

  // イベント情報の保存
  function saveEventInfo() {
    const info = {
      eventName: document.getElementById('eventName').value,
      eventDate: document.getElementById('eventDate').value,
      schedule: schedule
    };
    localStorage.setItem('eventInfo', JSON.stringify(info));
  }

  // イベント情報の読み込み
  function loadEventInfo() {
    const saved = localStorage.getItem('eventInfo');
    if (saved) {
      const info = JSON.parse(saved);
      document.getElementById('eventName').value = info.eventName || '';
      document.getElementById('eventDate').value = info.eventDate || '';
      schedule = info.schedule || [];
    }
  }

  // 日付設定
  function setEventDate() {
    const today = new Date().toISOString().split('T')[0];
    if (!document.getElementById('eventDate').value) {
      document.getElementById('eventDate').value = today;
    }
  }

  // スケジュール保存
  function saveSchedule() {
    saveEventInfo();
  }

  // テンプレートダウンロード
  function downloadSchedule() {
    const ws = XLSX.utils.json_to_sheet([
      {時刻: '14:00', パート名: 'オープニング', 'ロック（✓で固定）': '✓'},
      {時刻: '14:10', パート名: 'キーノート', 'ロック（✓で固定）': '✓'},
      {時刻: '14:40', パート名: 'パネルディスカッション', 'ロック（✓で固定）': ''},
      {時刻: '15:00', パート名: '休憩', 'ロック（✓で固定）': '✓'},
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'スケジュール');
    XLSX.writeFile(wb, 'EVENT_TIMER_template.xlsx');
  }

  // 進行開始
  function startShow() {
    if (schedule.length === 0) {
      showAlert('スケジュールを追加してください', 'error');
      return;
    }
    isRunning = true;
    sessionId = Math.random().toString(36).substr(2, 9);
    saveEventInfo();
    
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('timerDisplay').style.display = 'block';
    
    updateTimer();
    setInterval(updateTimer, 1000);
  }

  // タイマー更新
  function updateTimer() {
    if (!isRunning) return;

    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const currentTime = `${hours}:${minutes}`;

    document.getElementById('currentTime').textContent = currentTime;

    let currentPart = null;
    let nextPart = null;

    for (let i = 0; i < schedule.length; i++) {
      if (schedule[i].time <= currentTime) {
        currentPart = schedule[i];
        if (i < schedule.length - 1) {
          nextPart = schedule[i + 1];
        }
      }
    }

    if (currentPart) {
      document.getElementById('currentPart').textContent = `📍 ${currentPart.name}`;
    }

    if (nextPart) {
      const duration = calculateDuration(currentTime, nextPart.time);
      document.getElementById('nextPart').textContent = `→ ${nextPart.name} (${duration})`;
    } else {
      document.getElementById('nextPart').textContent = '→ イベント終了';
    }
  }

  // 一時停止
  function pauseShow() {
    isRunning = false;
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('startBtn').style.display = 'inline-block';
  }

  // 終了
  function stopShow() {
    isRunning = false;
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('timerDisplay').style.display = 'none';
  }

  // スタッフに共有
  function shareShow() {
    if (!sessionId) {
      showAlert('進行開始してから共有できます', 'error');
      return;
    }

    const shareURL = `${window.location.href.split('?')[0]}?view=${sessionId}`;
    document.getElementById('shareURL').value = shareURL;

    document.getElementById('qrCode').innerHTML = '';
    new QRCode(document.getElementById('qrCode'), {
      text: shareURL,
      width: 200,
      height: 200
    });

    document.getElementById('shareModal').classList.add('active');
  }

  // シェアモーダル閉じる
  function closeShareModal() {
    document.getElementById('shareModal').classList.remove('active');
  }

  // URLコピー
  function copyShareURL() {
    const url = document.getElementById('shareURL');
    url.select();
    document.execCommand('copy');
    showAlert('URLをコピーしました', 'success');
  }

  // 遅延調整
  function adjustDelay(minutes) {
    currentDelay += minutes;
    document.getElementById('delayMessage').textContent = currentDelay > 0 ? `現在 +${currentDelay}分 遅延` : currentDelay < 0 ? `現在 ${currentDelay}分 短縮` : 'リセット';
    saveEventInfo();
  }

  // アラート表示
  function showAlert(message, type = 'info') {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    
    const box = document.getElementById('alertBox');
    box.appendChild(alert);
    
    setTimeout(() => alert.remove(), 3000);
  }

  // 入力時に自動保存
  document.addEventListener('change', saveEventInfo);
</script>

</body>
</html>
